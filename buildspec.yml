version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20  # Matches your local Node version setup
    commands:
      - echo Installing dependencies...
      - npm install
  pre_build:
    commands:
      - echo Injecting frontend environment variables...
      # CodeBuild automatically pulls this variable from its project environment settings
      - echo "REACT_APP_API_URL=${REACT_APP_API_URL}" > .env
  build:
    commands:
      - echo Building React application...
      - npm run build
  post_build:
    commands:
      - echo Syncing build artifacts to S3...
      # Syncs only the contents of the 'dist' folder (Vite) or 'build' folder (CRA) to S3
      # --delete removes files in S3 that are no longer present in your new build code
      - aws s3 sync dist/ s3://$DEPLOY_BUCKET --delete

artifacts:
  files:
    - '**/*'
  base-directory: dist # Tracks the output directory path